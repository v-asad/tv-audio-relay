name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/TvAudioRelay.Core.Tests -c Release

  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/TvAudioRelay -c Release

      - name: Publish single-file exe (win-x64)
        run: >
          dotnet publish src/TvAudioRelay -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o dist/win-x64

      - name: Smoke test (help text runs on a real Windows box)
        run: dist/win-x64/tv-audio-relay.exe help

      - name: Zip
        run: Compress-Archive -Path dist/win-x64/* -DestinationPath dist/tv-audio-relay-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tv-audio-relay-win-x64
          path: dist/tv-audio-relay-win-x64.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/tv-audio-relay-win-x64.zip --title "${{ github.ref_name }}" --generate-notes
